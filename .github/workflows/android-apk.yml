name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Test and build installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"'
      - name: Check source structure
        run: python3 verify_source.py
      - name: Unit tests
        run: gradle --no-daemon --console=plain testDebugUnitTest
      - name: Android lint
        run: gradle --no-daemon --console=plain lintDebug
      - name: Print complete lint report
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('app/build').rglob('lint-results-debug.txt'))
          if reports:
              print(reports[0].read_text(encoding='utf-8'))
          else:
              xml_reports = list(Path('app/build').rglob('lint-results-debug.xml'))
              if not xml_reports:
                  print('No lint report: inspect the preceding failed step.')
              for report in xml_reports[:1]:
                  for issue in ET.parse(report).getroot().findall('issue'):
                      print(issue.attrib)
                      for location in issue.findall('location'):
                          print(location.attrib)
      - name: Build APK after checks pass
        run: gradle --no-daemon --console=plain assembleDebug
      - name: Package APK
        shell: python
        run: |
          from pathlib import Path
          import shutil, hashlib
          out = Path('output')
          out.mkdir(exist_ok=True)
          apk = out / 'HuanAssist-debug.apk'
          shutil.copy2('app/build/outputs/apk/debug/app-debug.apk', apk)
          (out / 'SHA256SUMS.txt').write_text(hashlib.sha256(apk.read_bytes()).hexdigest() + '  ' + apk.name + '\n')
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: HuanAssist-APK
          path: output/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-check-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/intermediates/lint_intermediate_text_report/
          if-no-files-found: ignore
          retention-days: 14
